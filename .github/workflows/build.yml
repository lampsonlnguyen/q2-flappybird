name: Build and release q2-flappybird
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      Q2_SYSROOT_URL: ${{ vars.Q2_SYSROOT_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make gcc zip unzip file squashfs-tools curl xz-utils debian-archive-keyring gpgv
      - name: Run portable tests
        run: make check
      - name: Fetch trusted Q2 ALSA sysroot
        if: env.Q2_SYSROOT_URL != ''
        run: |
          mkdir -p "$HOME/.cache/q2/sysroot"
          curl --fail --location --silent --show-error "$Q2_SYSROOT_URL" | tar -xz -C "$HOME/.cache/q2/sysroot"
      - name: Build pinned Q2 ALSA sysroot
        if: env.Q2_SYSROOT_URL == ''
        run: sh tools/sysroot.sh
      - name: Build Q2 package
        run: make
      - name: Verify Q2 package
        run: |
          unzip -t dist/q2-flappybird.zip
          for icon in icon.png icon-40.png pane.png; do
            unzip -Z1 dist/q2-flappybird.zip | grep -Fx ".flappybird/$icon"
          done
          file dist/.flappybird/icon.png | grep -F '52 x 52'
          file dist/.flappybird/icon-40.png | grep -F '40 x 40'
          file dist/.flappybird/pane.png | grep -F '96 x 96'
          unzip -p dist/q2-flappybird.zip .flappybird/q2app | grep -Fx 'game=1'
          unzip -p dist/q2-flappybird.zip .flappybird/q2app | grep -Fx 'audio=1'
          unzip -Z1 dist/q2-flappybird.zip | grep -Fx '.flappybird/sounds/sfx_wing.wav'
          file dist/.flappybird/q2-flappybird | grep -E 'ELF 32-bit LSB.*MIPS'
      - uses: actions/upload-artifact@v6
        with:
          name: q2-flappybird-card-app
          path: dist/q2-flappybird.zip
          if-no-files-found: error
  release:
    if: (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && (github.event.head_commit.message == 'Release v1.2.2' || github.event_name == 'workflow_dispatch')))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: q2-flappybird-card-app
          path: dist
      - name: Publish release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.2' }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/q2-flappybird.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/q2-flappybird.zip --target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG"
          fi
